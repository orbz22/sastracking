{# Ikon SVG inline (gaya Lucide, stroke 1.8, viewBox 24) — sengaja bukan emoji
   biar konsisten lintas platform dan bisa diwarnai lewat currentColor. #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "grid" -%}
  <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
  <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == "hash" -%}
  <path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>
{%- elif name == "music" -%}
  <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
{%- elif name == "video" -%}
  <path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/>
{%- elif name == "code" -%}
  <path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>
{%- elif name == "book" -%}
  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>
{%- elif name == "pulse" -%}
  <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
{%- elif name == "refresh" -%}
  <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>
  <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>
{%- elif name == "flame" -%}
  <path d="M12 2s4 4.5 4 8a4 4 0 0 1-8 0c0-1 .5-2 .5-2S6 11 6 14a6 6 0 0 0 12 0c0-5-6-12-6-12Z"/>
{%- elif name == "eye" -%}
  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == "trending" -%}
  <path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/>
{%- elif name == "layers" -%}
  <path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/>
{%- elif name == "check" -%}
  <circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>
{%- elif name == "alert" -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/>
{%- elif name == "tiktok" -%}
  <path d="M15 3v10.5a4 4 0 1 1-3.2-3.92"/><path d="M15 3a5.5 5.5 0 0 0 5 4.2"/>
{%- elif name == "instagram" -%}
  <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/>
  <circle cx="17.2" cy="6.8" r="1"/>
{%- elif name == "youtube" -%}
  <rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="m10.5 9.5 5 2.5-5 2.5Z"/>
{%- elif name == "inbox" -%}
  <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
  <path d="M5.5 5h13l3.5 7v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5l3.5-7Z"/>
{%- endif -%}
</svg>
{%- endmacro %}
